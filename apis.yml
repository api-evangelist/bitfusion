name: Bitfusion
description: >-
  Bitfusion (Bitfusion.io) was a GPU virtualization startup whose FlexDirect
  software pooled and disaggregated GPUs across a network so machine learning and
  AI workloads could share accelerator hardware on demand. VMware acquired Bitfusion
  in August 2019 and folded the technology into vSphere as "vSphere Bitfusion."
  VMware/Broadcom later declared End of Availability for vSphere Bitfusion effective
  May 2023, with end of maintenance in May 2025. The independent company no longer
  operates and the bitfusion.io domain no longer resolves; there is no independent,
  active public API surface remaining for this provider.
